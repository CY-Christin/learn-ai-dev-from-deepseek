# copyright = "Copyright &copy; 2026 Your name"

repo_url = "https://github.com/CY-Christin/learn-ai-dev-from-deepseek"
repo_name = "CY-Christin/learn-ai-dev-from-deepseek"
# edit_uri = "edit/main/docs/"

nav = [
  { "首页" = "index.md" },
  { "正文" = [
    { "01 · 这个仓库有多不寻常" = "01-背景与数据.md" },
    { "02 · Agent Notes" = "02-agent-notes.md" },
    { "03 · 机器门禁" = "03-机器门禁.md" },
    { "04 · Skills 蒸馏" = "04-skills蒸馏.md" },
    { "05 · 喂事实，不喂叮嘱" = "05-事实供给.md" },
    { "06 · 测试：防止 AI 骗你" = "06-测试哲学.md" },
    { "07 · 可以直接抄走的清单" = "07-可借鉴清单.md" },
    { "08 · 一手拆机" = "08-一手拆机.md" },
    { "09 · 发布之后：规则是怎么被改写的" = "09-规则的改写.md" },
